<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SHELL</title>
<style>
:root{color-scheme:dark;--bg:#07100f;--panel:#0d1918;--panel2:#132321;--line:#29413d;--line2:#1e302d;--ink:#eef8f5;--muted:#8ca7a1;--mint:#77e3ba;--aqua:#63cdda;--amber:#f5c77a;--edge:#ff3ea5;--shadow:0 22px 60px #0008}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1100px 720px at 12% -12%,#174d405e,transparent 60%),radial-gradient(900px 620px at 92% 114%,#13354866,transparent 64%),var(--bg);overflow:hidden}
button,input{font:inherit}

.boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#07100ff2;transition:opacity .25s}
.boot.hide{opacity:0;pointer-events:none}
.boot-card{width:min(390px,calc(100% - 36px));padding:26px;border:1px solid var(--line);border-radius:22px;background:#0d1918e8;box-shadow:var(--shadow);text-align:center}
.boot-mark{width:52px;height:52px;margin:0 auto 14px;border:1px solid #77e3ba66;border-radius:16px;display:grid;place-items:center;color:var(--mint);font-size:16px;font-weight:800;letter-spacing:.08em;background:#77e3ba12}
.boot h1{font-size:18px;font-weight:800;letter-spacing:.22em;margin:0 0 8px}
.boot p{margin:0;color:var(--muted);line-height:1.5;font-size:13px}

.topbar{position:fixed;top:0;left:0;right:0;z-index:60;height:calc(52px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;gap:10px;overflow:hidden;
  background:#0b1614ee;backdrop-filter:blur(14px);
  border-bottom:1.5px solid var(--edge);border-radius:0 0 16px 16px;
  box-shadow:0 10px 24px rgba(4,8,12,.5)}
.wordmark{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.wordmark b{font-size:15px;font-weight:800;letter-spacing:.22em}
.wordmark small{font-size:8px;letter-spacing:.11em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-grow{flex:1}
.tb-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:11px;background:#0d1918;color:var(--muted);cursor:pointer}
.tb-btn:hover{border-color:#77e3ba88;color:var(--ink)}
.tb-btn:disabled{opacity:.38;cursor:default}
.tb-btn svg{width:19px;height:19px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:var(--amber);background:#0b1715;font-size:11px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.pill.ok{color:var(--mint)}
.pill.ok i{background:var(--mint);box-shadow:0 0 9px var(--mint)}

.desktop{position:absolute;inset:calc(52px + env(safe-area-inset-top,0px)) 0 0 0;overflow:hidden}
.centre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.tree-globe{width:min(206px,44vw);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#1f4e40,#0c1a17 72%);
  border:1px solid #77e3ba55;
  box-shadow:inset 0 -22px 40px rgba(255,255,255,.10),inset 0 14px 26px rgba(0,0,0,.5),0 26px 60px rgba(4,10,10,.6),0 0 60px #77e3ba18;
  display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .18s}
.centre:hover .tree-globe,.centre:focus-visible .tree-globe{transform:translateY(-3px);outline:none}
.tree-globe::after{content:'';position:absolute;left:16%;top:12%;width:26%;height:18%;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(3px)}
.tree-globe svg{width:54%;height:54%;color:#bfe9d6;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.tree-label{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.tree-sub{font-size:11px;color:var(--muted);margin-top:-4px}
.desktop-hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:var(--muted);font-size:11px;opacity:.6}

#bubbles{position:absolute;inset:0}
.bubble{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;width:104px;cursor:grab;user-select:none;touch-action:none}
.bubble.dragging{cursor:grabbing;z-index:30;opacity:.94}
.bubble.merge-target .globe{border-color:var(--mint);box-shadow:0 0 0 3px #77e3ba44,inset 0 -14px 22px rgba(255,255,255,.16)}
.globe{width:72px;height:72px;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;
  background:rgba(13,25,24,.6);border:1px solid rgba(255,255,255,.34);
  box-shadow:inset 0 -14px 20px rgba(255,255,255,.16),inset 0 8px 14px rgba(255,255,255,.06),0 10px 20px rgba(4,10,10,.5);
  transition:transform .16s}
.bubble:hover .globe{transform:translateY(-2px)}
.globe::after{content:'';position:absolute;left:16%;top:12%;width:30%;height:22%;border-radius:50%;background:rgba(255,255,255,.5);filter:blur(1px)}
.globe .emoji{font-size:29px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.globe .count{position:absolute;right:-1px;bottom:-1px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--mint);color:#07120f;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid #08110f}
.bubble-label{font-size:11px;font-weight:600;text-align:center;color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.65);max-width:100%}
.bubble-label.hidden{display:none}

.ctx{position:fixed;z-index:150;min-width:176px;padding:5px;border:1px solid var(--line);border-radius:12px;background:#10211ef7;backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.ctx[hidden]{display:none}
.ctx button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 11px;border-radius:8px;cursor:pointer;font-size:13px}
.ctx button:hover{background:#77e3ba18}

.panel{position:absolute;inset:calc(52px + env(safe-area-inset-top,0px)) 0 0 0;z-index:40;background:#08110ff7;backdrop-filter:blur(4px);display:flex;flex-direction:column;transform:translateY(16px);opacity:0;pointer-events:none;transition:.2s}
.panel.show{transform:none;opacity:1;pointer-events:auto}
.panel-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line2)}
.panel-head h2{margin:0;font-size:16px;font-weight:800;letter-spacing:.06em}
.panel-head .spacer{flex:1}
.panel-body{flex:1;min-height:0;overflow:auto;padding:22px}
.page{max-width:1000px;margin:0 auto}
.eyebrow{color:var(--mint);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h2.head{font-size:24px;font-weight:700;margin:8px 0 10px}
.lede{color:var(--muted);line-height:1.6;margin:0;max-width:66ch}

.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
.filters button.active{color:#07120f;background:var(--mint);border-color:var(--mint)}
.search{width:100%;margin:14px 0 4px;border:1px solid var(--line);border-radius:12px;background:#091513;color:var(--ink);padding:11px 13px;outline:none}
.search:focus{border-color:#77e3ba88}

.doc-list{display:grid;gap:9px;margin-top:14px}
.doc{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:13px 15px;cursor:pointer;color:var(--ink)}
.doc:hover{border-color:#77e3ba66}
.doc .title{display:block;font-size:14px;font-weight:600}
.doc .snippet{display:block;margin-top:5px;color:var(--muted);font-size:12.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:3em;overflow:hidden}
.doc .when{display:block;margin-top:7px;color:var(--muted);font-size:10.5px;opacity:.8}
.tag{padding:4px 9px;border-radius:999px;font-size:10px;background:#172c28;color:var(--mint);white-space:nowrap}

.reader{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px 22px;margin-top:16px}
.reader-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.reader-head h3{margin:0;font-size:18px;font-weight:600;flex:1;overflow-wrap:anywhere}
.reader .when{color:var(--muted);font-size:11px;margin-bottom:14px}
.reader .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:14px}
.reader .body.none{color:var(--muted);font-style:italic}

.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:#77e3ba88}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#07120f;font-weight:700}
.btn.small{padding:6px 11px;font-size:12px}

.notice{padding:14px 16px;border:1px solid #f5c77a44;border-radius:14px;background:#f5c77a0b;color:#e8d3ad;font-size:12.5px;line-height:1.55;margin-top:16px}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px solid var(--line2);border-radius:14px;background:#0d1918a0;margin-top:14px}
.reasons{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:9px}
.reasons li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;border:1px solid var(--line2);border-radius:12px;background:#0a1514;padding:11px 13px;font-size:12.5px;color:var(--muted)}
.reasons b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}

.drawer-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:10px;margin-top:12px}
.drawer-app{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;border:1px solid var(--line2);border-radius:13px;background:var(--panel);padding:11px 12px}
.drawer-app .emoji{grid-row:span 2;font-size:22px;line-height:1}
.drawer-app b{grid-column:2;min-width:0;font-size:12.5px;font-weight:600;line-height:1.25}
.drawer-app button{grid-column:2;justify-self:start;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
.drawer-app button:hover{border-color:#77e3ba88}
.drawer-app button:disabled{opacity:.4;cursor:default}
.folder-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px;margin-top:10px}
.folder-app{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:var(--ink);cursor:pointer}
.folder-app .emoji{font-size:26px}
.folder-app span{font-size:11px;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);z-index:180;max-width:360px;padding:11px 15px;border:1px solid var(--line);border-radius:12px;background:#10211e;box-shadow:var(--shadow);font-size:12.5px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:820px){
  .wordmark small{display:none}
  .tree-label{letter-spacing:.14em}
}
</style>
</head>
<body>

<div class="boot" id="boot"><div class="boot-card">
  <div class="boot-mark">S</div>
  <h1>SHELL</h1>
  <p id="boot-copy">Starting your machine layer…</p>
</div></div>

<header class="topbar">
  <div class="wordmark"><b>SHELL</b><small>Secured · Home · Exported · Life · Logs</small></div>
  <div class="tb-grow"></div>
  <span class="pill" id="net-pill"><i></i><span>Tenari unreachable</span></span>
  <button class="tb-btn" id="live-btn" type="button" title="Open the live app" aria-label="Open the live app" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
  </button>
  <button class="tb-btn" id="drawer-btn" type="button" title="App drawer" aria-label="App drawer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M11 7.5h2"/><path d="M11 16.5h2"/></svg>
  </button>
</header>

<main class="desktop" id="desktop">
  <div id="bubbles"></div>
  <button class="centre" id="tree" type="button" aria-label="Open Memory Tree">
    <span class="tree-globe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-6"/><path d="M12 16c-3 0-5-2-5-4 0-1 .5-1.8 1.2-2.4C8 8.7 7.7 8 7.7 7.2 7.7 5.4 9.6 4 12 4s4.3 1.4 4.3 3.2c0 .8-.3 1.5-.5 2.4C16.5 10.2 17 11 17 12c0 2-2 4-5 4Z"/><path d="M9.5 19.5 12 17l2.5 2.5"/></svg>
    </span>
    <span class="tree-label">Memory Tree</span>
    <span class="tree-sub">Everything stored on this machine</span>
  </button>
  <p class="desktop-hint">Drag bubbles to move them · drop one on another to make a folder · right-click for options</p>
</main>

<section class="panel" id="panel" aria-label="Memory Tree" aria-hidden="true">
  <div class="panel-head">
    <h2>Memory Tree</h2>
    <div class="spacer"></div>
    <button class="btn small" id="panel-close" type="button">Close</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</section>

<section class="panel" id="drawer" aria-label="App drawer" aria-hidden="true">
  <div class="panel-head">
    <h2>App drawer</h2>
    <div class="spacer"></div>
    <button class="btn small" id="drawer-close" type="button">Close</button>
  </div>
  <div class="panel-body" id="drawer-body"></div>
</section>

<section class="panel" id="folderview" aria-label="Folder" aria-hidden="true">
  <div class="panel-head">
    <h2 id="folder-title">Folder</h2>
    <div class="spacer"></div>
    <button class="btn small" id="folder-close" type="button">Close</button>
  </div>
  <div class="panel-body" id="folder-body"></div>
</section>

<div class="ctx" id="ctx" hidden>
  <button type="button" data-act="open">Open</button>
  <button type="button" data-act="remove">Remove from desktop</button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
'use strict';

var REMOTE = 'https://app.tenari.world/localhub/';
var REMOTE_BASE = 'https://app.tenari.world';
var SIDECAR = 'http://localhost:5984';
var POLL_MS = 15000;
var LAYOUT_KEY = 'shell_desktop_layout_v1';

// Local mirror of public/js/app-catalog.js so the desktop is populated with no
// connection. The admin-only Dev group is left out. Keeping this in sync with the
// live catalog is a later refinement; step 5 moves the saved layout to the sidecar.
var CATALOG = [
  { cat: 'Personal', emoji: '🌿', apps: [
    { id:'fitness', label:'Fitness', emoji:'💪', url:'/fitness.html' },
    { id:'taste-buds', label:'Taste Buds', emoji:'🍳', url:'/taste-buds.html' },
    { id:'flora', label:'Flora', emoji:'🌱', url:'/flora.html' },
    { id:'habits', label:'Habits', emoji:'🔄', url:'/habits.html' },
    { id:'dream-tree', label:'Dream Cacher', emoji:'🌙', url:'/dream-tree.html' },
    { id:'journal', label:'Daily Journal', emoji:'📓', url:'/journal.html' },
    { id:'follow-up-studio', label:'Follow Up Studio', emoji:'✍️', url:'/follow-up-studio.html' }
  ] },
  { cat: 'Documents', emoji: '📄', apps: [
    { id:'notes', label:'Notes', emoji:'📝', url:'/notes.html' },
    { id:'scribble', label:'Scribble', emoji:'✏️', url:'/scribble/' },
    { id:'canvas', label:'Canvas', emoji:'🖼️', url:'/canvas/' },
    { id:'collage', label:'Binders', emoji:'📔', url:'/collage.html' },
    { id:'memory', label:'Memory Tree', emoji:'🧠', url:'/memory/' },
    { id:'today', label:'Daily Brief', emoji:'☀️', url:'/today.html' },
    { id:'tasks', label:'Tasks', emoji:'✅', url:'/tasks.html' },
    { id:'studio', label:'Contained Evolution Studios', emoji:'🎛️', url:'/studio.html' },
    { id:'templates', label:'Templates', emoji:'🧩', url:'/templates.html' }
  ] },
  { cat: 'Work', emoji: '💼', apps: [
    { id:'projects', label:'Projects', emoji:'🎯', url:'/projects/' },
    { id:'contractors', label:'Contractors', emoji:'📚', url:'/contractors.html' },
    { id:'boards', label:'Boards', emoji:'🗂️', url:'/boards.html' },
    { id:'ledger', label:'Ledger', emoji:'💰', url:'/ledger/' }
  ] },
  { cat: 'Tools', emoji: '🧰', apps: [
    { id:'automations', label:'Automations', emoji:'⚙️', url:'/settings/automations.html' },
    { id:'files', label:'Storage', emoji:'🗄️', url:'/files.html' },
    { id:'fetch', label:'Fetch', emoji:'🔭', url:'/fetch.html' },
    { id:'mapit', label:'Map It', emoji:'🗺️', url:'/mapit.html' },
    { id:'northstar', label:'Navigation', emoji:'🧭', url:'/northstar.html' },
    { id:'flow', label:'Flow', emoji:'🎙️', url:'/flow.html' }
  ] },
  { cat: 'Creative', emoji: '🎨', apps: [
    { id:'music', label:'Music Maker', emoji:'🎵', url:'/beatmkr.html' },
    { id:'image-studio', label:'Media Lab', emoji:'🎨', url:'/image-studio.html' },
    { id:'comedy-club', label:'Bit by Bit', emoji:'🎤', url:'/comedy-club.html' },
    { id:'inspire', label:'Inspire', emoji:'✦', url:'/inspire.html' }
  ] },
  { cat: 'Games', emoji: '🎮', apps: [
    { id:'games', label:'Games', emoji:'🎮', url:'/games.html' }
  ] }
];

// Workspaces the local canvas cannot serve on its own. Kept so the panel can say
// plainly what is missing and why, cloud reach and local build apart.
var PAGES = [
  { id: 'overview', icon: '⌂', label: 'Overview' },
  { id: 'memory', icon: '◇', label: 'Memory' },
  { id: 'notes', icon: '▤', label: 'Notes' },
  { id: 'companion', icon: '✦', label: 'Companion', cloud: true,
    why: 'Companion thinks in the cloud. Nothing it says can be produced on this machine, so it stays closed rather than pretending to answer.' },
  { id: 'camera', icon: '◉', label: 'Camera', local: true,
    why: 'The SHELL camera runs on this machine and needs no connection, but taking a picture is not part of the offline canvas yet. Open the live app when Tenari is reachable.' },
  { id: 'access', icon: '⛨', label: 'Access', local: true,
    why: 'Folder, website and trash approvals run entirely on this machine. They are not in the offline canvas yet — open the live app to change what Companion may reach.' },
  { id: 'tools', icon: '⌘', label: 'Local Tools', local: true,
    why: 'The local tool registry lives on this machine. Listing it is not part of the offline canvas yet; the live app shows every tool.' },
  { id: 'apps', icon: '▦', label: 'Apps', cloud: true,
    why: 'Today, Tasks, Files, Studio and the rest of Tenari are cloud screens. They need a connection.' }
];

var TYPE_LABELS = {
  memory: 'Memory', memories: 'Memory',
  note: 'Note', notes: 'Note',
  brain_dump: 'Brain dump', braindump: 'Brain dump', 'brain-dump': 'Brain dump', braindumps: 'Brain dump',
  scribble: 'Scribble', scribbles: 'Scribble',
  task: 'Task', tasks: 'Task',
  file: 'File', files: 'File'
};

var state = { open: null, docs: null, loadError: null, reachable: false, reading: null, query: '', filter: 'all', layout: null };
var $ = function (id) { return document.getElementById(id); };
var toastTimer = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function toast(message) {
  var el = $('toast');
  el.textContent = message;
  el.className = 'toast show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = 'toast'; }, 3200);
}

function withTimeout(ms) {
  var c = new AbortController();
  setTimeout(function () { c.abort(); }, ms);
  return c.signal;
}

// -- app catalog helpers ------------------------------------------------------

function roster() {
  var out = [];
  CATALOG.forEach(function (group) { group.apps.forEach(function (app) { out.push(app); }); });
  return out;
}

function appById(id) {
  return roster().filter(function (a) { return a.id === id; })[0] || null;
}

function onDesktop(appId) {
  return (state.layout.bubbles || []).some(function (b) {
    return b.appId === appId || (b.apps && b.apps.indexOf(appId) >= 0);
  });
}

// -- desktop layout ---------------------------------------------------------

function seedLayout() {
  var bubbles = CATALOG.map(function (group, i) {
    var angle = (-90 + i * (360 / CATALOG.length)) * Math.PI / 180;
    return {
      uid: 'cat-' + group.cat.toLowerCase(),
      kind: 'folder',
      label: group.cat,
      emoji: group.emoji,
      x: Math.round(50 + 31 * Math.cos(angle)),
      y: Math.round(50 + 33 * Math.sin(angle)),
      apps: group.apps.map(function (a) { return a.id; })
    };
  });
  return { v: 1, bubbles: bubbles };
}

function loadLayout() {
  try {
    var raw = localStorage.getItem(LAYOUT_KEY);
    var parsed = raw ? JSON.parse(raw) : null;
    if (parsed && Array.isArray(parsed.bubbles) && parsed.bubbles.length) return parsed;
  } catch (_) {}
  return seedLayout();
}

// TODO(step 5): persist the desktop layout through the sidecar /local/docs path
// so it syncs to Tenari instead of living only in this webview's localStorage.
function persist() {
  try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(state.layout)); } catch (_) {}
}

function bubbleByUid(uid) {
  return (state.layout.bubbles || []).filter(function (b) { return b.uid === uid; })[0] || null;
}

function renderBubbles() {
  var host = $('bubbles');
  host.innerHTML = '';
  (state.layout.bubbles || []).forEach(function (b) {
    var node = document.createElement('div');
    node.className = 'bubble';
    node.dataset.uid = b.uid;
    node.style.left = b.x + '%';
    node.style.top = b.y + '%';
    var count = b.kind === 'folder' && b.apps.length > 1
      ? '<span class="count">' + b.apps.length + '</span>' : '';
    node.innerHTML =
      '<span class="globe"><span class="emoji">' + esc(b.emoji || '📦') + '</span>' + count + '</span>' +
      '<span class="bubble-label' + (b.labelHidden ? ' hidden' : '') + '">' + esc(b.label) + '</span>';
    bindBubble(node, b);
    host.appendChild(node);
  });
}

function openBubble(b) {
  if (b.kind === 'app') { openApp(appById(b.appId)); return; }
  if (b.apps.length === 1) { openApp(appById(b.apps[0])); return; }
  openFolder(b);
}

function openApp(app) {
  if (!app) return;
  if (app.id === 'memory') { openTree(); return; }
  if (!state.reachable) { toast(app.label + ' needs a connection.'); return; }
  // step 4 replaces this whole-canvas handoff with an in-canvas window + tab orb.
  location.assign(REMOTE_BASE + app.url);
}

function openFolder(b) {
  setOpen('folderview');
  $('folder-title').textContent = b.label;
  var apps = b.apps.map(appById).filter(Boolean);
  $('folder-body').innerHTML = '<div class="page"><div class="folder-apps">' + apps.map(function (a) {
    return '<button class="folder-app" type="button" data-app="' + esc(a.id) + '">' +
      '<span class="emoji">' + esc(a.emoji) + '</span><span>' + esc(a.label) + '</span></button>';
  }).join('') + '</div></div>';
  Array.prototype.forEach.call($('folder-body').querySelectorAll('[data-app]'), function (el) {
    el.addEventListener('click', function () { openApp(appById(el.getAttribute('data-app'))); });
  });
}

function removeBubble(uid) {
  state.layout.bubbles = state.layout.bubbles.filter(function (b) { return b.uid !== uid; });
  persist();
  renderBubbles();
}

function mergeBubbles(dragUid, targetUid) {
  var drag = bubbleByUid(dragUid);
  var target = bubbleByUid(targetUid);
  if (!drag || !target || drag === target) return;
  var incoming = drag.kind === 'folder' ? drag.apps.slice() : [drag.appId];
  if (target.kind === 'app') {
    target.kind = 'folder';
    target.label = 'Folder';
    target.apps = [target.appId];
    delete target.appId;
  }
  incoming.forEach(function (id) { if (target.apps.indexOf(id) < 0) target.apps.push(id); });
  state.layout.bubbles = state.layout.bubbles.filter(function (b) { return b.uid !== dragUid; });
  persist();
  renderBubbles();
  toast('Combined into "' + target.label + '".');
}

function addAppToDesktop(app) {
  if (!app) return;
  if (onDesktop(app.id)) { toast(app.label + ' is already on the desktop.'); return; }
  state.layout.bubbles.push({
    uid: 'b' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36),
    kind: 'app', appId: app.id, label: app.label, emoji: app.emoji,
    x: 50 + Math.floor(Math.random() * 20 - 10), y: 44 + Math.floor(Math.random() * 16 - 8)
  });
  persist();
  renderBubbles();
  renderDrawer();
  toast(app.label + ' added to the desktop.');
}

// -- pointer drag + merge -------------------------------------------------------

function bindBubble(node, b) {
  var start = null;

  node.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    showCtx(e.clientX, e.clientY, b.uid);
  });

  node.addEventListener('pointerdown', function (e) {
    if (e.button === 2) return;
    hideCtx();
    var host = $('bubbles').getBoundingClientRect();
    start = { px: e.clientX, py: e.clientY, ox: b.x, oy: b.y, w: host.width, h: host.height, moved: false };
    node.setPointerCapture(e.pointerId);
  });

  node.addEventListener('pointermove', function (e) {
    if (!start) return;
    var dx = e.clientX - start.px, dy = e.clientY - start.py;
    if (!start.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    start.moved = true;
    node.classList.add('dragging');
    b.x = Math.min(96, Math.max(4, start.ox + dx / start.w * 100));
    b.y = Math.min(95, Math.max(5, start.oy + dy / start.h * 100));
    node.style.left = b.x + '%';
    node.style.top = b.y + '%';
    markMergeTarget(node, e.clientX, e.clientY);
  });

  node.addEventListener('pointerup', function (e) {
    if (!start) return;
    try { node.releasePointerCapture(e.pointerId); } catch (_) {}
    node.classList.remove('dragging');
    if (!start.moved) { start = null; openBubble(b); return; }
    var over = mergeTargetAt(node, e.clientX, e.clientY);
    clearMergeTargets();
    if (over) { start = null; mergeBubbles(b.uid, over); return; }
    b.x = Math.round(b.x); b.y = Math.round(b.y);
    persist();
    start = null;
  });
}

function otherBubbles(selfNode) {
  return Array.prototype.filter.call($('bubbles').children, function (n) { return n !== selfNode; });
}

function mergeTargetAt(selfNode, cx, cy) {
  var hit = null;
  otherBubbles(selfNode).forEach(function (n) {
    var r = n.querySelector('.globe').getBoundingClientRect();
    if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) hit = n.dataset.uid;
  });
  return hit;
}

function markMergeTarget(selfNode, cx, cy) {
  var uid = mergeTargetAt(selfNode, cx, cy);
  otherBubbles(selfNode).forEach(function (n) {
    n.classList.toggle('merge-target', n.dataset.uid === uid);
  });
}

function clearMergeTargets() {
  Array.prototype.forEach.call($('bubbles').children, function (n) { n.classList.remove('merge-target'); });
}

// -- context menu -------------------------------------------------------------

function showCtx(x, y, uid) {
  var ctx = $('ctx');
  ctx.dataset.uid = uid;
  ctx.style.left = Math.min(x, window.innerWidth - 190) + 'px';
  ctx.style.top = Math.min(y, window.innerHeight - 90) + 'px';
  ctx.hidden = false;
}

function hideCtx() { $('ctx').hidden = true; }

// -- drawer -----------------------------------------------------------------

function renderDrawer() {
  $('drawer-body').innerHTML = '<div class="page">' +
    '<div class="eyebrow">Every app</div><h2 class="head">App drawer</h2>' +
    '<p class="lede">Everything SHELL can open. Add an app to the desktop as its own bubble, then drag bubbles ' +
    'together to make folders.</p>' +
    CATALOG.map(function (group) {
      return '<h3 style="margin:22px 0 0;font-size:13px;letter-spacing:.08em;color:var(--muted)">' + esc(group.cat) + '</h3>' +
        '<div class="drawer-grid">' + group.apps.map(function (a) {
          var here = onDesktop(a.id);
          return '<div class="drawer-app"><span class="emoji">' + esc(a.emoji) + '</span><b>' + esc(a.label) + '</b>' +
            '<button type="button" data-add="' + esc(a.id) + '"' + (here ? ' disabled' : '') + '>' +
            (here ? 'On desktop' : 'Add to desktop') + '</button></div>';
        }).join('') + '</div>';
    }).join('') + '</div>';
  Array.prototype.forEach.call($('drawer-body').querySelectorAll('[data-add]'), function (el) {
    el.addEventListener('click', function () { addAppToDesktop(appById(el.getAttribute('data-add'))); });
  });
}

// -- overlays ---------------------------------------------------------------

function setOpen(id) {
  ['panel', 'drawer', 'folderview'].forEach(function (p) {
    var on = p === id;
    $(p).classList.toggle('show', on);
    $(p).setAttribute('aria-hidden', on ? 'false' : 'true');
  });
  state.open = id;
}

function closeOverlays() {
  ['panel', 'drawer', 'folderview'].forEach(function (p) {
    $(p).classList.remove('show');
    $(p).setAttribute('aria-hidden', 'true');
  });
  state.open = null;
}

// -- Memory Tree (local documents) ------------------------------------------

function loadLocalDocs(tries) {
  tries = tries || 0;
  return fetch(SIDECAR + '/local/docs', { cache: 'no-store', signal: withTimeout(3000) })
    .then(function (r) {
      if (!r.ok) throw new Error('The local data service answered with an error.');
      return r.json();
    })
    .then(function (body) {
      if (!body || typeof body.known !== 'boolean') throw new Error('The local data service sent something unreadable.');
      return body;
    })
    .catch(function (e) {
      if (tries < 3) {
        return new Promise(function (res) { setTimeout(res, 700); })
          .then(function () { return loadLocalDocs(tries + 1); });
      }
      throw e;
    });
}

function loadLocalDoc(id) {
  return fetch(SIDECAR + '/local/docs/' + encodeURIComponent(id), { cache: 'no-store', signal: withTimeout(3000) })
    .then(function (r) {
      if (!r.ok) throw new Error('That item could not be read from this machine.');
      return r.json();
    })
    .then(function (body) {
      if (!body.found || !body.doc) throw new Error('That item is no longer on this machine.');
      return body.doc;
    });
}

function typeLabel(doc) {
  var key = String(doc.type || doc.source || '').toLowerCase();
  return TYPE_LABELS[key] || (key ? key.replace(/[_-]+/g, ' ') : 'Document');
}

function isMemory(doc) {
  var key = String(doc.source || doc.type || '').toLowerCase();
  return key === 'memory' || key === 'memories';
}

function when(value) {
  if (!value) return '';
  var d = new Date(value);
  return isNaN(d) ? '' : d.toLocaleString();
}

function allDocs() {
  return (state.docs && state.docs.docs) || [];
}

function shownDocs() {
  var q = state.query.toLowerCase();
  return allDocs().filter(function (d) {
    if (state.filter === 'memory' && !isMemory(d)) return false;
    if (state.filter === 'documents' && isMemory(d)) return false;
    if (!q) return true;
    return String(d.title || '').toLowerCase().indexOf(q) >= 0 ||
           String(d.snippet || '').toLowerCase().indexOf(q) >= 0;
  });
}

function panelHtml() {
  var known = state.docs && state.docs.known;
  var memories = allDocs().filter(isMemory).length;
  var docs = allDocs().length - memories;

  var head = '<div class="eyebrow">' + (state.reachable ? 'Tenari reachable' : 'Offline') + '</div>' +
    '<h2 class="head">On this machine</h2>' +
    '<p class="lede">This is everything stored on this computer. Your local-only memories and documents never leave it, ' +
    'so they are readable with no connection. Anything that lives in Tenari\'s cloud is not shown here — an empty screen ' +
    'is better than a stale one.</p>';

  if (state.loadError) {
    return head +
      '<div class="notice">The local data service on this computer could not be reached, so nothing can be listed. ' +
      esc(state.loadError) + '</div>' +
      '<div class="empty"><button class="btn" id="retry-docs" type="button">Try again</button></div>' +
      reasonsHtml();
  }

  if (state.reading) return head + readerHtml() + reasonsHtml();

  var body;
  if (!known) {
    body = '<div class="empty">No local store has been created on this computer yet. Sign in to Tenari once while ' +
      'connected and your local-only items will be kept here.</div>';
  } else {
    var list = shownDocs();
    var filters = '<div class="filters">' +
      ['all', 'memory', 'documents'].map(function (f) {
        return '<button type="button" data-filter="' + f + '"' + (state.filter === f ? ' class="active"' : '') + '>' +
          (f === 'all' ? 'All' : f === 'memory' ? 'Memories' : 'Documents') + '</button>';
      }).join('') + '</div>';
    var search = '<input class="search" id="search" type="search" placeholder="Search this machine…" value="' + esc(state.query) + '">';
    var rows = list.length
      ? '<div class="doc-list">' + list.map(function (doc) {
          var stamp = when(doc.updated_at);
          return '<button class="doc" type="button" data-doc="' + esc(doc.id) + '">' +
            '<span><span class="title">' + esc(doc.title) + '</span>' +
            (doc.snippet ? '<span class="snippet">' + esc(doc.snippet) + '</span>' : '') +
            (stamp ? '<span class="when">' + esc(stamp) + '</span>' : '') + '</span>' +
            '<span class="tag">' + esc(typeLabel(doc)) + '</span></button>';
        }).join('') + '</div>'
      : '<div class="empty">' + (state.query
          ? 'Nothing here matches “' + esc(state.query) + '”.'
          : 'Nothing on this machine yet.') + '</div>';
    body = filters + search + rows;
  }

  var readonlyNote = 'Everything here is read-only. Editing local documents without a connection is a later change' +
    ' — until then nothing you typed here could be merged safely, so the canvas does not pretend to accept it.';

  return head +
    '<div class="notice">Kept on this computer: ' + (state.loadError ? '—' : memories) + ' local memories, ' +
    (state.loadError ? '—' : docs) + ' local documents. ' + readonlyNote + '</div>' +
    body +
    reasonsHtml();
}

function reasonsHtml() {
  return '<ul class="reasons">' + PAGES.filter(function (p) { return p.cloud || p.local; }).map(function (p) {
    return '<li><span>' + p.icon + '</span><span><b>' + esc(p.label) +
      (p.cloud ? ' — needs a connection' : ' — not in the offline shell yet') + '</b>' + esc(p.why) + '</span></li>';
  }).join('') + '</ul>';
}

function readerHtml() {
  var doc = state.reading;
  if (doc.loading) return '<div class="empty">Opening…</div>';
  if (doc.error) {
    return '<div class="reader"><div class="reader-head"><h3>Could not open that item</h3>' +
      '<button class="btn small" id="back" type="button">Back</button></div>' +
      '<div class="body none">' + esc(doc.error) + '</div></div>';
  }
  var stamp = when(doc.updated_at);
  return '<div class="reader">' +
    '<div class="reader-head"><h3>' + esc(doc.title) + '</h3>' +
    '<span class="tag">' + esc(typeLabel(doc)) + '</span>' +
    '<button class="btn small" id="back" type="button">Back</button></div>' +
    (stamp ? '<div class="when">' + esc(stamp) + '</div>' : '') +
    '<div class="body' + (doc.text ? '' : ' none') + '">' +
    esc(doc.text || 'This item has no text.') + '</div></div>';
}

function renderPanel() {
  $('panel-body').innerHTML = '<div class="page">' + panelHtml() + '</div>';
  wirePanel();
}

function wirePanel() {
  var retry = $('retry-docs');
  if (retry) retry.addEventListener('click', function () { refreshDocs(); });

  var back = $('back');
  if (back) back.addEventListener('click', function () { state.reading = null; renderPanel(); });

  var search = $('search');
  if (search) {
    search.addEventListener('input', function () {
      state.query = search.value;
      renderPanel();
      var again = $('search');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function (el) {
    el.addEventListener('click', function () { state.filter = el.getAttribute('data-filter'); renderPanel(); });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-doc]'), function (el) {
    el.addEventListener('click', function () { read(el.getAttribute('data-doc')); });
  });
}

function read(id) {
  state.reading = { loading: true };
  renderPanel();
  loadLocalDoc(id)
    .then(function (doc) { state.reading = doc; renderPanel(); })
    .catch(function (e) { state.reading = { error: e.message }; renderPanel(); });
}

function refreshDocs() {
  state.loadError = null;
  return loadLocalDocs()
    .then(function (data) { state.docs = data; })
    .catch(function (e) { state.loadError = e.message || 'Unknown error.'; })
    .then(function () { if (state.open === 'panel') renderPanel(); });
}

function openTree() {
  state.reading = null;
  setOpen('panel');
  renderPanel();
  if (!state.docs && !state.loadError) refreshDocs();
}

// -- network + boot -------------------------------------------------------------

function appReachable() {
  return fetch(REMOTE, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: withTimeout(3500) })
    .then(function () { return true; })
    .catch(function () { return false; });
}

function paintReach(ok) {
  state.reachable = ok;
  var pill = $('net-pill');
  pill.className = 'pill' + (ok ? ' ok' : '');
  pill.querySelector('span').textContent = ok ? 'Tenari reachable' : 'Tenari unreachable';
  $('live-btn').disabled = !ok;
  if (state.open === 'panel') renderPanel();
}

function watchNetwork() {
  setInterval(function () {
    appReachable().then(function (ok) { if (ok !== state.reachable) paintReach(ok); });
  }, POLL_MS);
}

function openLiveApp() {
  if (!state.reachable) { toast('Tenari is not reachable right now.'); return; }
  location.assign(REMOTE);
}

function showShell() {
  $('boot').classList.add('hide');

  state.layout = loadLayout();
  renderBubbles();
  renderDrawer();

  $('tree').addEventListener('click', openTree);
  $('panel-close').addEventListener('click', closeOverlays);
  $('drawer-close').addEventListener('click', closeOverlays);
  $('folder-close').addEventListener('click', closeOverlays);
  $('live-btn').addEventListener('click', openLiveApp);
  $('drawer-btn').addEventListener('click', function () {
    if (state.open === 'drawer') { closeOverlays(); return; }
    renderDrawer();
    setOpen('drawer');
  });

  $('ctx').addEventListener('click', function (e) {
    var act = e.target.getAttribute('data-act');
    var uid = $('ctx').dataset.uid;
    hideCtx();
    if (!uid || !act) return;
    if (act === 'open') { var b = bubbleByUid(uid); if (b) openBubble(b); }
    if (act === 'remove') removeBubble(uid);
  });
  document.addEventListener('pointerdown', function (e) {
    if (!$('ctx').hidden && !$('ctx').contains(e.target)) hideCtx();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!$('ctx').hidden) { hideCtx(); return; }
    if (state.open) closeOverlays();
  });
  window.addEventListener('resize', function () { hideCtx(); });

  watchNetwork();
  appReachable().then(paintReach);
}

// The canvas is the home. It always renders locally and never navigates away on
// its own; handing off to the live app is an explicit choice on the topbar.
showShell();
})();
</script>
</body>
</html>
