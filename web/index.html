<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tenari Command Center</title>
<style>
:root{color-scheme:dark;--bg:#07100f;--panel:#0d1918;--panel2:#132321;--line:#29413d;--line2:#1e302d;--ink:#eef8f5;--muted:#8ca7a1;--mint:#77e3ba;--aqua:#63cdda;--amber:#f5c77a;--shadow:0 22px 60px #0008}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(900px 620px at 12% -10%,#174d405e,transparent 62%),radial-gradient(760px 520px at 90% 100%,#13354866,transparent 68%),var(--bg);overflow:hidden}
button,input{font:inherit}

.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#07100ff2}
.boot.hide{display:none}
.boot-card{width:min(420px,calc(100% - 36px));padding:28px;border:1px solid var(--line);border-radius:22px;background:#0d1918e8;box-shadow:var(--shadow);text-align:center}
.boot-mark{width:54px;height:54px;margin:0 auto 14px;border:1px solid #77e3ba66;border-radius:18px;display:grid;place-items:center;color:var(--mint);font-size:19px;font-weight:700;background:#77e3ba12}
.boot h1{font-size:20px;font-weight:600;margin:0 0 8px}
.boot p{margin:0;color:var(--muted);line-height:1.5}

.shell{height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}
.side{padding:20px 14px;display:flex;flex-direction:column;border-right:1px solid var(--line2);background:#081311db}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.brand-mark{width:37px;height:37px;border:1px solid #77e3ba66;border-radius:12px;display:grid;place-items:center;color:var(--mint);font-size:13px;font-weight:700;background:#77e3ba10}
.brand strong{font-size:13px;letter-spacing:.06em}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.nav{display:grid;gap:5px}
.nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:10px 11px;border-radius:11px;display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer}
.nav button:hover,.nav button.active{color:var(--ink);background:#77e3ba12}
.nav button.dim .label{opacity:.65}
.nav .icon{width:22px;text-align:center;font-size:16px}
.side-foot{margin-top:auto;padding:12px 9px;border-top:1px solid var(--line2);color:var(--muted);font-size:11px;line-height:1.5}
.side-foot b{color:var(--mint)}

.main{min-width:0;height:100vh;display:flex;flex-direction:column}
.top{height:66px;flex:0 0 66px;padding:0 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line2);background:#081311a8}
.top h1{margin:0;font-size:18px;font-weight:600}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--amber);background:#0b1715;font-size:11px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.pill.ok{color:var(--mint)}
.pill.ok i{background:var(--mint);box-shadow:0 0 9px var(--mint)}

.content{flex:1;min-height:0;overflow:auto;padding:24px}
.page{max-width:1000px;margin:0 auto}
.eyebrow{color:var(--mint);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
h2.head{font-size:26px;font-weight:600;margin:8px 0 10px}
.lede{color:var(--muted);line-height:1.6;margin:0;max-width:65ch}

.reconnect{display:none;align-items:center;gap:12px;margin-bottom:16px;padding:13px 16px;border:1px solid #77e3ba55;border-radius:14px;background:#77e3ba10;font-size:13px}
.reconnect.show{display:flex}
.reconnect span{flex:1;color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:14px}
.card{border:1px solid var(--line2);border-radius:17px;background:#0d1918d9;padding:17px;min-width:0}
.card h3{margin:0;font-size:13px;font-weight:600}
.metric{font-size:22px;font-weight:600;margin:15px 0 5px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}

.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.btn:hover{border-color:#77e3ba88}
.btn.primary{background:var(--mint);border-color:var(--mint);color:#07120f;font-weight:700}
.btn.small{padding:6px 11px;font-size:12px}

.search{width:100%;margin:16px 0 4px;border:1px solid var(--line);border-radius:12px;background:#091513;color:var(--ink);padding:11px 13px;outline:none}
.search:focus{border-color:#77e3ba88}

.doc-list{display:grid;gap:9px;margin-top:14px}
.doc{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border:1px solid var(--line2);border-radius:14px;background:var(--panel);padding:13px 15px;cursor:pointer;color:var(--ink)}
.doc:hover{border-color:#77e3ba66}
.doc .title{display:block;font-size:14px;font-weight:600}
.doc .snippet{display:block;margin-top:5px;color:var(--muted);font-size:12.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:3em;overflow:hidden}
.doc .when{display:block;margin-top:7px;color:var(--muted);font-size:10.5px;opacity:.8}
.tag{padding:4px 9px;border-radius:999px;font-size:10px;background:#172c28;color:var(--mint);white-space:nowrap}

.reader{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px 22px;margin-top:16px}
.reader-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.reader-head h3{margin:0;font-size:18px;font-weight:600;flex:1;overflow-wrap:anywhere}
.reader .when{color:var(--muted);font-size:11px;margin-bottom:14px}
.reader .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:14px}
.reader .body.none{color:var(--muted);font-style:italic}

.notice{padding:14px 16px;border:1px solid #f5c77a44;border-radius:14px;background:#f5c77a0b;color:#e8d3ad;font-size:12.5px;line-height:1.55;margin-top:16px}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px solid var(--line2);border-radius:14px;background:#0d1918a0;margin-top:14px}
.unavailable{margin-top:18px;padding:26px;border:1px solid var(--line2);border-radius:18px;background:#0d1918d9}
.unavailable .mark{font-size:26px;margin-bottom:12px}
.unavailable p{margin:0;color:var(--muted);line-height:1.6;max-width:60ch}
.reasons{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:9px}
.reasons li{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;border:1px solid var(--line2);border-radius:12px;background:#0a1514;padding:11px 13px;font-size:12.5px;color:var(--muted)}
.reasons b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}

@media(max-width:820px){
  body{overflow:auto}
  .shell{height:auto;min-height:100vh;grid-template-columns:1fr}
  .side{position:fixed;z-index:50;left:0;right:0;bottom:0;height:60px;padding:6px 5px;border:0;border-top:1px solid var(--line);flex-direction:row;background:#081311f2}
  .brand,.side-foot{display:none}
  .nav{width:100%;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
  .nav button{justify-content:center;padding:8px 2px;border-radius:9px}
  .nav .icon{width:auto;font-size:15px}
  .nav .label{display:none}
  .main{height:auto;min-height:100vh}
  .top{position:sticky;top:0;z-index:30;padding:0 14px}
  .content{padding:16px 14px 86px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="boot" id="boot"><div class="boot-card">
  <div class="boot-mark">T</div>
  <h1>Tenari Command Center</h1>
  <p id="boot-copy">Connecting this machine to Tenari…</p>
</div></div>

<div class="shell">
  <aside class="side">
    <div class="brand"><div class="brand-mark">T</div><div><strong>TENARI</strong><small>Command Center</small></div></div>
    <nav class="nav" id="nav" aria-label="Command Center"></nav>
    <div class="side-foot"><b>Local first.</b><br>Reading what is stored on this machine.</div>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="page-title">Overview</h1>
      <div class="spacer"></div>
      <span class="pill" id="net-pill"><i></i><span>Tenari unreachable</span></span>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
(function () {
'use strict';

var REMOTE = 'https://app.tenari.world/localhub/';
var SIDECAR = 'http://localhost:5984';
var POLL_MS = 15000;

var PAGES = [
  { id: 'overview', icon: '⌂', label: 'Overview' },
  { id: 'memory', icon: '◇', label: 'Memory' },
  { id: 'notes', icon: '▤', label: 'Notes' },
  { id: 'companion', icon: '✦', label: 'Companion', cloud: true,
    why: 'Companion thinks in the cloud. Nothing it says can be produced on this machine, so it stays closed rather than pretending to answer.' },
  { id: 'camera', icon: '◉', label: 'Camera', local: true,
    why: 'The Hub camera runs on this machine and needs no connection, but taking a picture is not part of the offline shell yet. Open the full Command Center when Tenari is reachable.' },
  { id: 'access', icon: '⛨', label: 'Access', local: true,
    why: 'Folder, website and trash approvals run entirely on this machine. They are not in the offline shell yet — open the full Command Center to change what Companion may reach.' },
  { id: 'tools', icon: '⌘', label: 'Local Tools', local: true,
    why: 'The local tool registry lives on this machine. Listing it is not part of the offline shell yet; the full Command Center shows every tool.' },
  { id: 'apps', icon: '▦', label: 'Apps', cloud: true,
    why: 'Today, Tasks, Files, Studio and the rest of Tenari are cloud screens. They need a connection.' }
];

var TYPE_LABELS = {
  memory: 'Memory', memories: 'Memory',
  note: 'Note', notes: 'Note',
  brain_dump: 'Brain dump', braindump: 'Brain dump', 'brain-dump': 'Brain dump', braindumps: 'Brain dump',
  scribble: 'Scribble', scribbles: 'Scribble',
  task: 'Task', tasks: 'Task',
  file: 'File', files: 'File'
};

var state = { page: 'overview', docs: null, loadError: null, reachable: false, reading: null, query: '' };
var $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function withTimeout(ms) {
  var c = new AbortController();
  setTimeout(function () { c.abort(); }, ms);
  return c.signal;
}

function appReachable() {
  return fetch(REMOTE, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: withTimeout(3500) })
    .then(function () { return true; })
    .catch(function () { return false; });
}

function loadLocalDocs(tries) {
  tries = tries || 0;
  return fetch(SIDECAR + '/local/docs', { cache: 'no-store', signal: withTimeout(3000) })
    .then(function (r) {
      if (!r.ok) throw new Error('The local data service answered with an error.');
      return r.json();
    })
    .then(function (body) {
      if (!body || typeof body.known !== 'boolean') throw new Error('The local data service sent something unreadable.');
      return body;
    })
    .catch(function (e) {
      if (tries < 3) {
        return new Promise(function (res) { setTimeout(res, 700); })
          .then(function () { return loadLocalDocs(tries + 1); });
      }
      throw e;
    });
}

function loadLocalDoc(id) {
  return fetch(SIDECAR + '/local/docs/' + encodeURIComponent(id), { cache: 'no-store', signal: withTimeout(3000) })
    .then(function (r) {
      if (!r.ok) throw new Error('That item could not be read from this machine.');
      return r.json();
    })
    .then(function (body) {
      if (!body.found || !body.doc) throw new Error('That item is no longer on this machine.');
      return body.doc;
    });
}

function typeLabel(doc) {
  var key = String(doc.type || doc.source || '').toLowerCase();
  return TYPE_LABELS[key] || (key ? key.replace(/[_-]+/g, ' ') : 'Document');
}

function isMemory(doc) {
  var key = String(doc.source || doc.type || '').toLowerCase();
  return key === 'memory' || key === 'memories';
}

function when(value) {
  if (!value) return '';
  var d = new Date(value);
  return isNaN(d) ? '' : d.toLocaleString();
}

function bucket(name) {
  var docs = (state.docs && state.docs.docs) || [];
  return docs.filter(function (d) { return name === 'memory' ? isMemory(d) : !isMemory(d); });
}

function matches(doc) {
  if (!state.query) return true;
  var q = state.query.toLowerCase();
  return String(doc.title || '').toLowerCase().indexOf(q) >= 0 ||
         String(doc.snippet || '').toLowerCase().indexOf(q) >= 0;
}

function renderNav() {
  var nav = $('nav');
  nav.innerHTML = '';
  PAGES.forEach(function (page) {
    var button = document.createElement('button');
    button.type = 'button';
    button.className = (page.id === state.page ? 'active' : '') + (page.cloud || page.local ? ' dim' : '');
    button.innerHTML = '<span class="icon">' + page.icon + '</span><span class="label">' + esc(page.label) + '</span>';
    button.addEventListener('click', function () { open(page.id); });
    nav.appendChild(button);
  });
}

function open(id) {
  state.page = id;
  state.reading = null;
  var page = PAGES.filter(function (p) { return p.id === id; })[0] || PAGES[0];
  $('page-title').textContent = page.label;
  renderNav();
  render();
  $('content').scrollTop = 0;
}

function reconnectBanner() {
  if (!state.reachable) return '';
  return '<div class="reconnect show"><span>Tenari is reachable again.</span>' +
    '<button class="btn primary small" id="go-live" type="button">Open the live app</button></div>';
}

function render() {
  var host = $('content');
  var page = PAGES.filter(function (p) { return p.id === state.page; })[0] || PAGES[0];
  var body;
  if (state.page === 'overview') body = overviewHtml();
  else if (state.page === 'memory' || state.page === 'notes') body = listHtml(state.page);
  else body = unavailableHtml(page);
  host.innerHTML = '<div class="page">' + reconnectBanner() + body + '</div>';
  wire();
}

function overviewHtml() {
  var known = state.docs && state.docs.known;
  var memories = bucket('memory').length;
  var notes = bucket('notes').length;
  var storage = state.loadError
    ? '<div class="notice">The local data service on this computer could not be reached, so nothing can be listed. ' +
      esc(state.loadError) + '</div>'
    : (!known
      ? '<div class="notice">No local store has been created on this computer yet. Sign in to Tenari once while connected and your local-only items will be kept here.</div>'
      : '');

  var head = state.reachable
    ? '<div class="eyebrow">Reconnected</div>' +
      '<h2 class="head">Tenari is back.</h2>' +
      '<p class="lede">Open the live app for everything in your account. This page keeps showing what is stored on ' +
      'this machine, so nothing you were reading disappears while you finish.</p>'
    : '<div class="eyebrow">Offline</div>' +
      '<h2 class="head">Tenari can\'t be reached.</h2>' +
      '<p class="lede">This is everything stored on this machine. Your local-only memories and documents never leave it, ' +
      'so they are readable right now. Anything that lives in Tenari\'s cloud is not shown at all — an empty screen is ' +
      'better than a stale one.</p>';

  return head +
    storage +
    '<div class="grid">' +
      '<article class="card"><h3>Local memories</h3><div class="metric">' + (state.loadError ? '—' : memories) + '</div>' +
        '<p>The 💾 drawer. Kept on this computer and readable with no connection.</p></article>' +
      '<article class="card"><h3>Local documents</h3><div class="metric">' + (state.loadError ? '—' : notes) + '</div>' +
        '<p>Notes, brain dumps, scribbles and tasks you kept local.</p></article>' +
    '</div>' +
    '<div class="notice">Everything on this page is read-only. Editing local documents without a connection is a later ' +
    'change — until then nothing you typed here could be merged safely, so the shell does not pretend to accept it.</div>' +
    '<ul class="reasons">' + PAGES.filter(function (p) { return p.cloud || p.local; }).map(function (p) {
      return '<li><span>' + p.icon + '</span><span><b>' + esc(p.label) +
        (p.cloud ? ' — needs a connection' : ' — not in the offline shell yet') + '</b>' + esc(p.why) + '</span></li>';
    }).join('') + '</ul>';
}

function listHtml(which) {
  var memory = which === 'memory';
  var all = bucket(memory ? 'memory' : 'notes');
  var docs = all.filter(matches);

  var head = '<div class="eyebrow">' + (memory ? 'On this machine' : 'On this machine') + '</div>' +
    '<h2 class="head">' + (memory ? 'Local memories' : 'Local documents') + '</h2>' +
    '<p class="lede">' + (memory
      ? 'Memories you moved out of Tenari\'s cloud. Companion cannot read these, and neither can we — they only exist here.'
      : 'Notes, brain dumps, scribbles and tasks kept on this machine instead of the cloud.') + '</p>';

  if (state.loadError) {
    return head + '<div class="empty">The local data service on this computer could not be reached.<br><br>' +
      '<button class="btn" id="retry-docs" type="button">Try again</button></div>';
  }
  if (state.reading) return head + readerHtml();
  if (!state.docs || !state.docs.known) {
    return head + '<div class="empty">No local store has been created on this computer yet. Sign in to Tenari once ' +
      'while connected and anything you keep local will be readable here.</div>';
  }
  if (!all.length) {
    return head + '<div class="empty">' + (memory
      ? 'No local-only memories on this computer yet.'
      : 'No local documents on this computer yet.') + '</div>';
  }

  var search = '<input class="search" id="search" type="search" placeholder="Search ' +
    (memory ? 'memories' : 'documents') + '…" value="' + esc(state.query) + '">';

  if (!docs.length) {
    return head + search + '<div class="empty">Nothing here matches “' + esc(state.query) + '”.</div>';
  }

  return head + search + '<div class="doc-list">' + docs.map(function (doc) {
    var stamp = when(doc.updated_at);
    return '<button class="doc" type="button" data-doc="' + esc(doc.id) + '">' +
      '<span><span class="title">' + esc(doc.title) + '</span>' +
      (doc.snippet ? '<span class="snippet">' + esc(doc.snippet) + '</span>' : '') +
      (stamp ? '<span class="when">' + esc(stamp) + '</span>' : '') + '</span>' +
      '<span class="tag">' + esc(typeLabel(doc)) + '</span></button>';
  }).join('') + '</div>';
}

function readerHtml() {
  var doc = state.reading;
  if (doc.loading) return '<div class="empty">Opening…</div>';
  if (doc.error) {
    return '<div class="reader"><div class="reader-head"><h3>Could not open that item</h3>' +
      '<button class="btn small" id="back" type="button">Back</button></div>' +
      '<div class="body none">' + esc(doc.error) + '</div></div>';
  }
  var stamp = when(doc.updated_at);
  return '<div class="reader">' +
    '<div class="reader-head"><h3>' + esc(doc.title) + '</h3>' +
    '<span class="tag">' + esc(typeLabel(doc)) + '</span>' +
    '<button class="btn small" id="back" type="button">Back</button></div>' +
    (stamp ? '<div class="when">' + esc(stamp) + '</div>' : '') +
    '<div class="body' + (doc.text ? '' : ' none') + '">' +
    esc(doc.text || 'This item has no text.') + '</div></div>';
}

function unavailableHtml(page) {
  return '<div class="eyebrow">' + (page.cloud ? 'Needs a connection' : 'Not in the offline shell') + '</div>' +
    '<h2 class="head">' + esc(page.label) + '</h2>' +
    '<div class="unavailable"><div class="mark">' + page.icon + '</div><p>' + esc(page.why) + '</p></div>';
}

function wire() {
  var live = $('go-live');
  if (live) live.addEventListener('click', function () { location.replace(REMOTE); });

  var retry = $('retry-docs');
  if (retry) retry.addEventListener('click', function () { refreshDocs(); });

  var back = $('back');
  if (back) back.addEventListener('click', function () { state.reading = null; render(); });

  var search = $('search');
  if (search) {
    search.addEventListener('input', function () {
      state.query = search.value;
      render();
      var again = $('search');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-doc]'), function (el) {
    el.addEventListener('click', function () { read(el.getAttribute('data-doc')); });
  });
}

function read(id) {
  state.reading = { loading: true };
  render();
  loadLocalDoc(id)
    .then(function (doc) { state.reading = doc; render(); })
    .catch(function (e) { state.reading = { error: e.message }; render(); });
}

function refreshDocs() {
  state.loadError = null;
  return loadLocalDocs()
    .then(function (data) { state.docs = data; })
    .catch(function (e) { state.loadError = e.message || 'Unknown error.'; })
    .then(function () { render(); });
}

function watchNetwork() {
  setInterval(function () {
    appReachable().then(function (ok) {
      if (ok === state.reachable) return;
      state.reachable = ok;
      var pill = $('net-pill');
      pill.className = 'pill' + (ok ? ' ok' : '');
      pill.querySelector('span').textContent = ok ? 'Tenari reachable' : 'Tenari unreachable';
      render();
    });
  }, POLL_MS);
}

function showShell() {
  $('boot').classList.add('hide');
  renderNav();
  render();
  refreshDocs();
  watchNetwork();
}

appReachable().then(function (ok) {
  if (ok) location.replace(REMOTE);
  else showShell();
});
})();
</script>
</body>
</html>
