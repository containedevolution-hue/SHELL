<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHELL</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#eef8f5;background:#07100f;--panel:#0d1918;--line:#29413d;--mint:#77e3ba;--muted:#8ca7a1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#174d405e,transparent 45%),#07100f}button{font:inherit}header{height:64px;padding:0 22px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#0b1614e8}header strong{letter-spacing:.2em}header span{margin-left:auto;color:var(--mint);font-size:.85rem}.hero{padding:8vh 24px 4vh;text-align:center}.hero h1{font-size:clamp(2rem,6vw,4.5rem);margin:0}.hero p{color:var(--muted);max-width:580px;margin:12px auto}.apps{width:min(900px,calc(100% - 32px));margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.app,.empty{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px}.app button{width:100%;margin-top:22px;padding:10px;border:1px solid #77e3ba66;border-radius:10px;background:#77e3ba14;color:var(--mint);cursor:pointer}.app small{display:block;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;color:var(--muted)}
</style></head><body><header><strong>SHELL</strong><span id="state">Connecting to local services…</span></header><main><section class="hero"><h1>Your apps. On your machine.</h1><p>SHELL discovers installed Contained Evolution apps through versioned local manifests. An account or Tenari connection is never required.</p></section><section class="apps" id="apps"><div class="empty">Reading installed apps…</div></section></main><script>
(function(){'use strict';
var SIDECAR='http://127.0.0.1:5984';var host=document.getElementById('apps');var state=document.getElementById('state');
function esc(value){return String(value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function render(apps){if(!apps.length){host.innerHTML='<div class="empty"><b>No apps installed</b><br>Install a compatible app package into SHELL to begin.</div>';return;}host.innerHTML=apps.map(function(app){return '<article class="app"><h2>'+esc(app.name)+'</h2><small>Version '+esc(app.version)+' · local manifest v'+app.contractVersion+'</small><button data-url="'+esc(app.launchUrl)+'">Open</button></article>';}).join('');Array.prototype.forEach.call(host.querySelectorAll('[data-url]'),function(button){button.onclick=function(){location.assign(SIDECAR+button.getAttribute('data-url'));};});}
fetch(SIDECAR+'/v1/apps',{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('Local app registry unavailable');return response.json();}).then(function(body){var apps=Array.isArray(body.apps)?body.apps:[];state.textContent=apps.length+' local app'+(apps.length===1?'':'s')+' ready';render(apps);}).catch(function(){state.textContent='Local services unavailable';host.innerHTML='<div class="empty">Start the SHELL sidecar to discover and open installed apps.</div>';});
})();
</script></body></html>
