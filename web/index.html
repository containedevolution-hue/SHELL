<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHELL</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#eef8f5;background:#07100f;--panel:#0d1918;--line:#29413d;--mint:#77e3ba;--muted:#a4bcb6}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}header{padding:22px 5%;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line)}header strong{letter-spacing:.2em}header span{margin-left:auto;color:var(--muted);font-size:14px}main{max-width:1080px;margin:auto;padding:36px 24px}h1{font-size:32px;margin:0 0 8px}p{color:var(--muted)}nav{display:flex;gap:12px;margin:24px 0}nav button,.app button{padding:10px 18px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--mint)}nav button[aria-selected=true]{background:var(--mint);color:#07100f}.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.app,.empty{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:24px}.app h2{margin:0 0 8px}.app button{display:block;width:100%;margin-top:20px;border-color:var(--mint)}.app small{color:var(--muted)}.empty{grid-column:1/-1}.error{color:#ffbdb2}button:disabled{opacity:.65;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:4px}[hidden]{display:none!important}@media(max-width:600px){header{flex-wrap:wrap}header span{margin:0}nav{flex-wrap:wrap}}
</style></head><body><header><strong>SHELL</strong><span id="state" role="status">Connecting…</span></header>
<main><h1>Your apps</h1><p>Choose your tools. Keep your work on your machine.</p><nav role="tablist" aria-label="Apps"><button id="mine-tab" role="tab" aria-selected="true" aria-controls="mine">My apps</button><button id="store-tab" role="tab" aria-selected="false" aria-controls="store">Contained Evolution Apps</button></nav>
<p id="message" role="status" hidden></p><section id="mine" class="apps" role="tabpanel" aria-labelledby="mine-tab"><p class="empty">Reading installed apps…</p></section><section id="store" role="tabpanel" aria-labelledby="store-tab" hidden><p>The starter collection is included with SHELL. Install it here without an account or connection.</p><div id="catalog" class="apps"></div></section></main><script src="./apps.js"></script></body></html>
