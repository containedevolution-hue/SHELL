<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LocalHub</title>
  <!-- The Tauri window opens directly at https://app.containedevolution.com/localhub/
       (see ../src-tauri/tauri.conf.json -> app.windows[0].url), so this file
       is normally never shown. It exists only so Tauri has a frontendDist to
       point at. The meta-refresh below is a fallback if someone opens this
       file directly in a browser. -->
  <meta http-equiv="refresh" content="0; url=https://app.containedevolution.com/localhub/" />
  <style>
    html, body { margin: 0; padding: 0; background: #0a0e1a; color: #d9e1f2;
                 font-family: system-ui, sans-serif; height: 100%; }
    .center { display: flex; align-items: center; justify-content: center;
              height: 100%; text-align: center; }
    .panel { padding: 24px 32px; }
    .panel h1 { font-weight: 600; margin: 0 0 8px; font-size: 20px; }
    .panel p { margin: 0; opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <div class="center"><div class="panel">
    <h1>Contained Evolution — LocalHub</h1>
    <p>Loading the app…</p>
  </div></div>
</body>
</html>
