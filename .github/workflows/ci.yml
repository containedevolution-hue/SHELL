name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: node-sidecar
      - run: npm test

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dedup-engine
            src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-node-binary.mjs
      - run: cargo check --manifest-path dedup-engine/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
